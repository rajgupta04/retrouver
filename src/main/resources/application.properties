# SQLite datasource — file-based, zero server config
spring.datasource.url=jdbc:sqlite:retrouver.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Disable Hibernate auto-DDL — we handle schema in DatabaseInitializer
spring.jpa.hibernate.ddl-auto=none

# Disable Spring Security's default login form (we'll use JWT)
spring.security.user.name=disabled
spring.security.user.password=disabled
